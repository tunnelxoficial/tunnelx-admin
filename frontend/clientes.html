<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - TunnelX Admin</title>

    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
</head>
<body>
    <div id="app"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Data Management
        async function fetchClients() {
            try {
                return await Clients.getAll();
            } catch (error) {
                console.error('Failed to fetch clients', error);
                return [];
            }
        }

        // Render Page
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const content = document.getElementById('page-content');
                if (!content) return;

                content.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <div class="search-box" style="display: flex; gap: 0.5rem;">
                            <!-- Search could be added here -->
                        </div>
                        <button class="btn btn-primary" id="btn-add">
                            <i class="fa-solid fa-plus"></i> Novo Cliente
                        </button>
                    </div>

                    <div class="table-container">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>CPF</th>
                                        <th>Email</th>
                                        <th>WhatsApp</th>
                                        <th>Cidade/UF</th>
                                        <th>Acesso ao app</th>
                                        <th style="text-align: right;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="clients-table-body">
                                    <tr><td colspan="7" style="text-align: center; padding: 2rem;">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                refreshTable();
                
                document.getElementById('btn-add').addEventListener('click', () => openModal());

            }, 100);
        });

        // Table Logic
        async function refreshTable() {
            const tbody = document.getElementById('clients-table-body');
            if (!tbody) return;

            try {
                const clients = await fetchClients();
                
                if (clients.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-light); padding: 2rem;">Nenhum cliente encontrado.</td></tr>`;
                    return;
                }

                tbody.innerHTML = clients.map(client => `
                    <tr>
                        <td>
                            <div style="font-weight: 500;">${client.name}</div>
                        </td>
                        <td>${client.cpf || '-'}</td>
                        <td>${client.email}</td>
                        <td>${client.whatsapp}</td>
                        <td>${client.cidade || '-'} / ${client.uf || '-'}</td>
                        <td>${accessBadge(client)}</td>
                        <td style="text-align: right;">
                            <button class="btn btn-sm btn-secondary" onclick="managePassword(${client.id})" title="${client.has_app_access ? 'Gerar nova senha do app' : 'Liberar acesso ao app'}">
                                <i class="fa-solid fa-key"></i>
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="openModal(${client.id})" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteClient(${client.id})" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger-color); padding: 2rem;">Erro ao carregar dados.</td></tr>`;
            }
        }

        // Actions
        window.openModal = async (id = null) => {
            let client = { 
                name: '', 
                cpf: '',
                email: '', 
                whatsapp: '', 
                cep: '',
                uf: '', 
                cidade: '', 
                bairro: '', 
                logradouro: '', 
                complemento: '' 
            };
            
            if (id) {
                const clients = await fetchClients();
                const found = clients.find(c => c.id === id);
                if (found) client = found;
            }
            
            const isEdit = !!id;

            const formHTML = `
                <form id="client-form">
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Nome Completo</label>
                            <input type="text" name="name" class="form-control" value="${client.name}" required>
                        </div>
                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" name="cpf" class="form-control" value="${client.cpf || ''}" placeholder="000.000.000-00" oninput="this.value = Masks.cpf(this.value)">
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" value="${client.email}" required>
                        </div>
                        <div class="form-group">
                            <label>WhatsApp</label>
                            <input type="text" name="whatsapp" class="form-control" value="${client.whatsapp}" required placeholder="(00) 00000-0000" oninput="this.value = Masks.phone(this.value)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>CEP</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" name="cep" id="cep-input" class="form-control" value="${client.cep || ''}" placeholder="00000-000" oninput="this.value = Masks.cep(this.value)" maxlength="9">
                            <button type="button" class="btn btn-secondary" onclick="buscarCep()" title="Buscar Endereço"><i class="fa-solid fa-search"></i></button>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 3fr; gap: 1rem;">
                        <div class="form-group">
                            <label>UF</label>
                            <input type="text" name="uf" id="uf-input" class="form-control" value="${client.uf}" maxlength="2" placeholder="UF">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" name="cidade" id="cidade-input" class="form-control" value="${client.cidade}" placeholder="Cidade">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" name="bairro" id="bairro-input" class="form-control" value="${client.bairro}" placeholder="Bairro">
                    </div>

                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" name="logradouro" id="logradouro-input" class="form-control" value="${client.logradouro}" placeholder="Rua, Av, etc">
                    </div>

                    <div class="form-group">
                        <label>Complemento</label>
                        <input type="text" name="complemento" class="form-control" value="${client.complemento}" placeholder="Apto, Bloco, etc">
                    </div>

                    <div style="border-top: 1px solid var(--border-color, #e5e7eb); margin-top: 1rem; padding-top: 1rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Acesso ao aplicativo</label>
                        <p style="color: var(--text-light, #6b7280); font-size: 0.85rem; margin: 0 0 0.75rem;">
                            O cliente entra no app com o <strong>CPF</strong> acima e uma senha gerada aqui.
                            As conexões dele são importadas sozinhas depois do login.
                        </p>
                        ${isEdit
                            ? `<div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                                   ${accessBadge(client)}
                                   <button type="button" class="btn btn-sm btn-secondary" onclick="managePassword(${client.id || 0})">
                                       <i class="fa-solid fa-key"></i> ${client.has_app_access ? 'Gerar nova senha' : 'Liberar acesso'}
                                   </button>
                               </div>`
                            : `<label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                   <input type="checkbox" name="generatePassword" id="gen-password" checked>
                                   <span>Gerar senha de acesso ao salvar</span>
                               </label>`}
                    </div>
                </form>
            `;

            Modal.show({
                title: isEdit ? 'Editar Cliente' : 'Novo Cliente',
                content: formHTML,
                confirmText: 'Salvar',
                onConfirm: async () => {
                    const form = document.getElementById('client-form');
                    
                    const payload = {
                        name: form.querySelector('[name="name"]').value,
                        cpf: form.querySelector('[name="cpf"]').value,
                        email: form.querySelector('[name="email"]').value,
                        whatsapp: form.querySelector('[name="whatsapp"]').value,
                        cep: form.querySelector('[name="cep"]').value,
                        uf: form.querySelector('[name="uf"]').value,
                        cidade: form.querySelector('[name="cidade"]').value,
                        bairro: form.querySelector('[name="bairro"]').value,
                        logradouro: form.querySelector('[name="logradouro"]').value,
                        complemento: form.querySelector('[name="complemento"]').value
                    };

                    // So no cadastro novo: na edicao a senha e gerada pelo botao
                    // dedicado, para nao trocar credencial ao corrigir um endereco.
                    const gerar = form.querySelector('[name="generatePassword"]');
                    if (gerar && gerar.checked) payload.generatePassword = true;

                    try {
                        const salvo = isEdit
                            ? await Clients.update(id, payload)
                            : await Clients.create(payload);
                        refreshTable();
                        if (salvo && salvo.generated_password) {
                            showPassword(salvo.name || payload.name, salvo.cpf || payload.cpf, salvo.generated_password);
                        }
                    } catch (error) {
                        alert('Erro ao salvar: ' + error.message);
                    }
                }
            });
        };

        window.buscarCep = async () => {
            const cepInput = document.getElementById('cep-input');
            const cep = cepInput.value.replace(/\D/g, '');
            
            if (cep.length !== 8) {
                alert('CEP inválido. Digite 8 números.');
                return;
            }

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                
                if (data.erro) {
                    alert('CEP não encontrado.');
                    return;
                }

                document.getElementById('uf-input').value = data.uf;
                document.getElementById('cidade-input').value = data.localidade;
                document.getElementById('bairro-input').value = data.bairro;
                document.getElementById('logradouro-input').value = data.logradouro;
                
            } catch (error) {
                console.error('Erro ao buscar CEP:', error);
                alert('Erro ao buscar endereço. Verifique sua conexão.');
            }
        };

        // Selo de acesso: responde de relance quem ja consegue entrar no app.
        window.accessBadge = (client) => {
            if (client.has_app_access) {
                return '<span style="display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;background:#dcfce7;color:#166534;font-size:.78rem;font-weight:600;">'
                     + '<i class="fa-solid fa-circle-check"></i> Liberado</span>';
            }
            if (!client.cpf) {
                return '<span style="display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;background:#fef3c7;color:#92400e;font-size:.78rem;font-weight:600;">'
                     + '<i class="fa-solid fa-triangle-exclamation"></i> Sem CPF</span>';
            }
            return '<span style="display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;background:#f3f4f6;color:#4b5563;font-size:.78rem;font-weight:600;">'
                 + '<i class="fa-solid fa-lock"></i> Sem acesso</span>';
        };

        /**
         * A senha aparece UMA vez.
         *
         * O banco guarda so o hash: nao existe tela de "ver senha". Por isso este
         * modal e o unico momento em que ela pode ser copiada, e diz isso na cara
         * do operador antes que ele feche a janela.
         */
        window.showPassword = (nome, cpf, senha) => {
            Modal.show({
                title: 'Senha de acesso gerada',
                content: `
                    <p style="margin-top:0;">Acesso ao aplicativo de <strong>${nome || 'cliente'}</strong>:</p>
                    <div style="display:grid;gap:.6rem;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;">
                        <div>
                            <div style="font-size:.75rem;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;">Login (CPF)</div>
                            <div style="font-family:monospace;font-size:1.05rem;">${cpf || '-'}</div>
                        </div>
                        <div>
                            <div style="font-size:.75rem;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;">Senha</div>
                            <div style="display:flex;align-items:center;gap:.6rem;">
                                <span id="senha-gerada" style="font-family:monospace;font-size:1.4rem;font-weight:700;letter-spacing:.05em;">${senha}</span>
                                <button type="button" class="btn btn-sm btn-secondary" onclick="copiarSenha()">
                                    <i class="fa-solid fa-copy"></i> Copiar
                                </button>
                            </div>
                        </div>
                    </div>
                    <p style="color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.7rem .8rem;margin-bottom:0;font-size:.88rem;">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        Anote agora. Esta senha não fica guardada e não pode ser consultada depois — só substituída por uma nova.
                    </p>
                `,
                confirmText: 'Já anotei',
                onConfirm: async () => {}
            });
        };

        window.copiarSenha = async () => {
            const alvo = document.getElementById('senha-gerada');
            if (!alvo) return;
            try {
                await navigator.clipboard.writeText(alvo.textContent.trim());
                alvo.style.background = '#dcfce7';
                setTimeout(() => { alvo.style.background = 'transparent'; }, 900);
            } catch {
                // clipboard exige contexto seguro (https): sem ele, seleciona para
                // o operador copiar no teclado em vez de falhar em silencio.
                const faixa = document.createRange();
                faixa.selectNodeContents(alvo);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(faixa);
            }
        };

        window.managePassword = async (id) => {
            const clients = await fetchClients();
            const client = clients.find(c => c.id === id);
            if (!client) return;

            if (!client.cpf) {
                alert('Cadastre o CPF deste cliente antes: é com ele que o acesso ao aplicativo é feito.');
                return;
            }

            const jaTem = client.has_app_access;

            Modal.show({
                title: jaTem ? 'Gerar nova senha' : 'Liberar acesso ao aplicativo',
                content: jaTem
                    ? `<p>Gerar uma nova senha para <strong>${client.name}</strong>?</p>
                       <p style="color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.7rem .8rem;font-size:.88rem;">
                         A senha atual deixa de funcionar na hora. Se o cliente estiver com o app aberto,
                         ele continua conectado até sair — no próximo login precisará da senha nova.
                       </p>`
                    : `<p>Criar a senha de acesso de <strong>${client.name}</strong>?</p>
                       <p style="color:#6b7280;font-size:.9rem;">
                         Ele passa a entrar no app com o CPF <strong>${client.cpf}</strong> e a senha gerada aqui.
                       </p>`,
                confirmText: jaTem ? 'Gerar nova senha' : 'Liberar acesso',
                type: jaTem ? 'danger' : 'primary',
                onConfirm: async () => {
                    try {
                        const r = await Clients.generatePassword(id);
                        refreshTable();
                        // O modal atual fecha ao confirmar; o proximo abre depois.
                        setTimeout(() => showPassword(r.name, r.cpf, r.password), 60);
                    } catch (error) {
                        alert('Erro ao gerar a senha: ' + error.message);
                    }
                }
            });
        };

        window.deleteClient = (id) => {
            Modal.show({
                title: 'Excluir Cliente',
                content: '<p>Tem certeza que deseja excluir este cliente? Esta ação não pode ser desfeita.</p>',
                confirmText: 'Excluir',
                type: 'danger',
                onConfirm: async () => {
                    try {
                        await Clients.delete(id);
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao excluir: ' + error.message);
                    }
                }
            });
        };
    </script>
</body>
</html>
