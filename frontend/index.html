<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - TunnelX Admin</title>

    <meta name="theme-color" content="#1356C1">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
</head>
<body>
    <div id="app"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Data Management
        async function loadDashboard() {
            renderSkeleton();
            try {
                const stats = await Dashboard.getStats();
                renderDashboard(stats);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                const content = document.getElementById('page-content');
                if (content) {
                    content.innerHTML = `
                        <div class="card card-pad">
                            <div class="empty">
                                <i class="fa-solid fa-plug-circle-xmark"></i>
                                <h4>Não foi possível carregar o painel</h4>
                                <p>Verifique se a API está no ar e tente de novo.</p>
                                <button class="btn btn-secondary" style="margin-top:1rem" onclick="loadDashboard()">
                                    <i class="fa-solid fa-rotate-right"></i> Tentar de novo
                                </button>
                            </div>
                        </div>`;
                }
            }
        }

        function renderSkeleton() {
            const content = document.getElementById('page-content');
            if (!content) return;

            const skeletonCard = `
                <div class="skeleton-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <div class="skeleton skeleton-text" style="width: 100px;"></div>
                        <div class="skeleton skeleton-circle"></div>
                    </div>
                    <div class="skeleton skeleton-text" style="width: 60px; height: 2rem;"></div>
                    <div class="skeleton skeleton-text" style="width: 80px; margin-top: 0.5rem;"></div>
                </div>
            `;

            content.innerHTML = `
                <div class="grid-stats">${skeletonCard.repeat(4)}</div>
                <div class="grid-2">
                    <div class="skeleton-card" style="height: 300px;">
                        <div class="skeleton skeleton-text" style="width: 150px; height: 1.5rem; margin-bottom: 1.5rem;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 2rem; margin-bottom: 1rem;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 2rem; margin-bottom: 1rem;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 2rem;"></div>
                    </div>
                    <div class="skeleton-card" style="height: 300px;">
                        <div class="skeleton skeleton-text" style="width: 150px; height: 1.5rem; margin-bottom: 1.5rem;"></div>
                        <div style="display: grid; gap: 1rem;">
                            <div class="skeleton skeleton-text" style="width: 100%; height: 3rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 100%; height: 3rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 100%; height: 3rem;"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * Contagem que sobe até o valor.
         *
         * Dá ao painel a sensação de que os dados acabaram de chegar, em vez de
         * já estarem ali. Duração curta de propósito: quem abre o painel quer o
         * número, não a animação.
         */
        function animarNumero(el, valor, formatar) {
            const inicio = performance.now();
            const dur = 700;
            const passo = (t) => {
                const p = Math.min(1, (t - inicio) / dur);
                // easeOutCubic: rápido no início, freia no fim.
                const e = 1 - Math.pow(1 - p, 3);
                el.textContent = formatar(valor * e);
                if (p < 1) requestAnimationFrame(passo);
                else el.textContent = formatar(valor);
            };
            requestAnimationFrame(passo);
        }

        function renderDashboard(stats) {
            const content = document.getElementById('page-content');
            if (!content) return;

            const moeda = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
            const inteiro = (v) => Math.round(v).toString();

            const semEstoqueBaixo = stats.stock.lowStockList.length === 0;

            content.innerHTML = `
                <div class="grid-stats">
                    <div class="stat">
                        <div class="stat-top">
                            <span class="stat-label">Clientes totais</span>
                            <span class="stat-icon"><i class="fa-solid fa-users"></i></span>
                        </div>
                        <p class="stat-value" data-valor="${stats.clients.total}" data-fmt="int">0</p>
                    </div>

                    <div class="stat is-green">
                        <div class="stat-top">
                            <span class="stat-label">Conexões ativas</span>
                            <span class="stat-icon is-green"><i class="fa-solid fa-network-wired"></i></span>
                        </div>
                        <p class="stat-value" data-valor="${stats.connections.active}" data-fmt="int">0</p>
                        <span class="stat-hint">de ${stats.connections.total} registradas</span>
                    </div>

                    <div class="stat is-amber">
                        <div class="stat-top">
                            <span class="stat-label">Valor em estoque</span>
                            <span class="stat-icon is-amber"><i class="fa-solid fa-coins"></i></span>
                        </div>
                        <p class="stat-value" data-valor="${stats.stock.totalValue}" data-fmt="moeda">—</p>
                    </div>

                    <div class="stat is-violet">
                        <div class="stat-top">
                            <span class="stat-label">Planos disponíveis</span>
                            <span class="stat-icon is-violet"><i class="fa-solid fa-clipboard-list"></i></span>
                        </div>
                        <p class="stat-value" data-valor="${stats.plans.total}" data-fmt="int">0</p>
                        <span class="stat-hint">${stats.products.total} produto(s) cadastrado(s)</span>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="card card-pad">
                        <div class="card-head">
                            <h3 class="card-title">Estoque baixo</h3>
                            ${stats.stock.lowStockCount > 0
                                ? `<span class="badge badge-danger"><span class="dot"></span>${stats.stock.lowStockCount} item(ns)</span>`
                                : '<span class="badge badge-success">tudo certo</span>'}
                        </div>

                        ${semEstoqueBaixo ? `
                            <div class="empty" style="padding:2rem 1rem;">
                                <i class="fa-solid fa-boxes-stacked"></i>
                                <h4>Nenhum item em falta</h4>
                                <p>Todos os produtos estão acima do mínimo de 10 unidades.</p>
                            </div>
                        ` : `
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Produto</th>
                                            <th style="text-align:right;">Qtd.</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${stats.stock.lowStockList.map(item => `
                                            <tr>
                                                <td class="cell-title">${item.product}</td>
                                                <td style="text-align:right;">
                                                    <span class="badge badge-danger">${item.quantity}</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <div style="margin-top:1rem; text-align:center;">
                                <a href="estoque.html" class="btn btn-ghost btn-sm">
                                    Ver estoque completo <i class="fa-solid fa-arrow-right"></i>
                                </a>
                            </div>
                        `}
                    </div>

                    <div class="card card-pad">
                        <div class="card-head">
                            <h3 class="card-title">Ações rápidas</h3>
                        </div>
                        <div style="display:grid; gap:.6rem;">
                            <a href="clientes.html" class="btn btn-secondary" style="justify-content:flex-start;">
                                <i class="fa-solid fa-user-plus"></i> Novo cliente
                            </a>
                            <a href="conexoes.html" class="btn btn-secondary" style="justify-content:flex-start;">
                                <i class="fa-solid fa-circle-plus"></i> Nova conexão
                            </a>
                            <a href="estoque.html" class="btn btn-secondary" style="justify-content:flex-start;">
                                <i class="fa-solid fa-box-open"></i> Gerenciar estoque
                            </a>
                            <a href="planos.html" class="btn btn-secondary" style="justify-content:flex-start;">
                                <i class="fa-solid fa-clipboard-list"></i> Gerenciar planos
                            </a>
                        </div>
                    </div>
                </div>
            `;

            content.querySelectorAll('.stat-value[data-valor]').forEach(el => {
                const v = Number(el.dataset.valor) || 0;
                animarNumero(el, v, el.dataset.fmt === 'moeda' ? moeda : inteiro);
            });
        }

        // Render Page
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDashboard, 100);
        });
    </script>
</body>
</html>
