<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - TunnelX Admin</title>

    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
</head>
<body>
    <div id="app"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Data Management
        async function loadDashboard() {
            try {
                const connections = await Connections.getAll();
                renderDashboard(connections);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function renderDashboard(connections) {
            const content = document.getElementById('page-content');
            if (!content) return;

            // Calculate Stats
            const total = connections.length;
            const active = connections.filter(c => c.status === 'active').length;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const newThisMonth = connections.filter(c => {
                const d = new Date(c.createdAt);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).length;

            // Sort by Date (newest first)
            const recentConnections = [...connections].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);

            content.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                    <!-- Total Connections -->
                    <div class="card" style="background: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h3 style="font-size: 0.875rem; color: var(--text-light); font-weight: 500;">Total de Conexões</h3>
                            <div style="width: 40px; height: 40px; background: #EFF6FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color);">
                                <i class="fa-solid fa-network-wired"></i>
                            </div>
                        </div>
                        <p style="font-size: 1.5rem; font-weight: 700; color: var(--text-color);">${total}</p>
                        <span style="font-size: 0.75rem; color: var(--text-light); font-weight: 500;">
                            Base completa
                        </span>
                    </div>

                    <!-- Active Users -->
                    <div class="card" style="background: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h3 style="font-size: 0.875rem; color: var(--text-light); font-weight: 500;">Conexões Ativas</h3>
                            <div style="width: 40px; height: 40px; background: #DCFCE7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--secondary-color);">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>
                        <p style="font-size: 1.5rem; font-weight: 700; color: var(--text-color);">${active}</p>
                        <span style="font-size: 0.75rem; color: var(--secondary-color); font-weight: 500;">
                            ${((active/total || 0) * 100).toFixed(0)}% do total
                        </span>
                    </div>
                    
                    <!-- New This Month -->
                    <div class="card" style="background: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h3 style="font-size: 0.875rem; color: var(--text-light); font-weight: 500;">Novas (Mês)</h3>
                            <div style="width: 40px; height: 40px; background: #F3E8FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #9333EA;">
                                <i class="fa-solid fa-calendar-plus"></i>
                            </div>
                        </div>
                        <p style="font-size: 1.5rem; font-weight: 700; color: var(--text-color);">${newThisMonth}</p>
                        <span style="font-size: 0.75rem; color: var(--text-light); font-weight: 500;">
                            Neste mês
                        </span>
                    </div>
                </div>

                <div style="margin-top: 2rem; background: white; border-radius: 0.75rem; border: 1px solid var(--border-color); padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.125rem;">Atividade Recente</h3>
                    ${recentConnections.length > 0 ? `
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-color);">
                                        <th style="text-align: left; padding: 0.75rem 0; font-weight: 600; font-size: 0.875rem; color: var(--text-light);">Nome</th>
                                        <th style="text-align: left; padding: 0.75rem 0; font-weight: 600; font-size: 0.875rem; color: var(--text-light);">Status</th>
                                        <th style="text-align: right; padding: 0.75rem 0; font-weight: 600; font-size: 0.875rem; color: var(--text-light);">Data</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${recentConnections.map(c => `
                                        <tr style="border-bottom: 1px solid var(--border-color);">
                                            <td style="padding: 0.75rem 0; font-size: 0.875rem;">${c.name}</td>
                                            <td style="padding: 0.75rem 0;">
                                                <span style="
                                                    padding: 0.25rem 0.5rem; 
                                                    border-radius: 9999px; 
                                                    font-size: 0.75rem; 
                                                    font-weight: 500;
                                                    background-color: ${c.status === 'active' ? '#DCFCE7' : '#FEE2E2'};
                                                    color: ${c.status === 'active' ? '#166534' : '#991B1B'};
                                                ">
                                                    ${c.status === 'active' ? 'Ativo' : 'Inativo'}
                                                </span>
                                            </td>
                                            <td style="text-align: right; padding: 0.75rem 0; font-size: 0.875rem; color: var(--text-light);">
                                                ${new Date(c.createdAt).toLocaleDateString('pt-BR')}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    ` : `
                        <p style="color: var(--text-light);">Nenhuma atividade recente encontrada.</p>
                    `}
                </div>
            `;
        }

        // Render Page
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDashboard, 100);
        });
    </script>
</body>
</html>
