<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - TunnelX Admin</title>

    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="img/logo.png" alt="TunnelX Logo" style="height: 60px; margin: 0 auto;">
                </div>
                <h2>Crie sua conta</h2>
                <p style="color: var(--text-light)">Sem permissão</p>
            </div>
        </div>
    </div>

    <!-- Modals support -->
    <div id="modal-container"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');

            try {
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registrando...';
                btn.disabled = true;

                await Auth.register(username, email, password);
                
                Modal.show({
                    title: 'Sucesso!',
                    content: 'Conta criada com sucesso. Você será redirecionado para o login.',
                    confirmText: 'Ir para Login',
                    onConfirm: () => window.location.href = 'login.html'
                });

            } catch (error) {
                Modal.show({
                    title: 'Erro',
                    content: error.message,
                    type: 'danger',
                    confirmText: 'Fechar'
                });
            } finally {
                btn.innerHTML = 'Registrar';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
