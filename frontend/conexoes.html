<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexões - TunnelX Admin</title>

    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
    <style>
        .status-file-loader {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Custom Search Select */
        .search-select-container {
            position: relative;
            width: 100%;
        }
        .search-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }
        .search-select-trigger:hover {
            border-color: var(--primary-color);
        }
        .search-select-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            margin-top: 0.25rem;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }
        .search-select-options.show {
            display: block;
        }
        .search-select-input {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-bottom: 1px solid var(--border-color);
            outline: none;
            font-family: inherit;
        }
        .search-select-option {
            padding: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .search-select-option:hover {
            background-color: #f8fafc;
        }
        .search-select-option.selected {
            background-color: #eff6ff;
            color: var(--primary-color);
        }
        .option-main {
            font-weight: 500;
        }
        .option-sub {
            font-size: 0.75rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Data Management
        let cachedClients = [];
        let cachedConnections = [];
        let cachedPlans = [];

        async function fetchConnections() {
            try {
                const conns = await Connections.getAll();
                cachedConnections = conns;
                return conns;
            } catch (error) {
                console.error('Failed to fetch connections', error);
                return [];
            }
        }

        async function preloadClients() {
            try {
                cachedClients = await Clients.getAll();
            } catch (err) {
                console.error('Erro ao pré-carregar clientes', err);
            }
        }

        async function preloadPlans() {
            try {
                cachedPlans = await Plans.getAll();
            } catch (err) {
                console.error('Erro ao pré-carregar planos', err);
            }
        }

        // Render Page
        document.addEventListener('DOMContentLoaded', () => {
            preloadClients();
            preloadPlans();

            setTimeout(() => {
                const content = document.getElementById('page-content');
                if (!content) return;

                content.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <div class="search-box" style="display: flex; gap: 0.5rem;">
                            <!-- Search could be added here -->
                        </div>
                        <button class="btn btn-primary" id="btn-add">
                            <i class="fa-solid fa-plus"></i> Nova Conexão
                        </button>
                    </div>

                    <div class="table-container">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Plano</th>
                                        <th>Telefone</th>
                                        <th>Pacote</th>
                                        <th>Conexões</th>
                                        <th>Status</th>
                                        <th>Status File</th>
                                        <th>Internet</th>
                                        <th style="text-align: right;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="connections-table-body">
                                    <tr><td colspan="9" style="text-align: center; padding: 2rem;">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                refreshTable();
                
                // Start polling for status file updates
                setInterval(updateStatusFiles, 30000);

                document.getElementById('btn-add').addEventListener('click', () => openModal());

            }, 100);
        });

        // Helper to render Status File column
        function getStatusFileContent(conn) {
            if (conn.status_queue === 'WAIT') {
                return `
                    <div class="status-file-loader">
                        <div class="spinner"></div>
                        <span>Criando...</span>
                    </div>
                `;
            } else if (conn.status_queue === 'CREATED') {
                return `
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-sm btn-outline-primary" onclick="showQRCode(${conn.id})" title="Ver QR Code">
                            <i class="fa-solid fa-qrcode"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success" onclick="downloadConfig(${conn.id})" title="Baixar Config">
                            <i class="fa-solid fa-download"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="copyConfig(${conn.id})" title="Copiar Config">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                `;
            }
            return '-';
        }

        // Action Functions for Status File
        window.showQRCode = async (id) => {
            const connections = await fetchConnections();
            const conn = connections.find(c => c.id === id);
            if (!conn || !conn.qrcode) {
                alert('QR Code não disponível.');
                return;
            }

            // If qrcode is buffer/blob, convert to base64
            // Assuming backend sends a buffer array or base64 string
            // If it's a Buffer array from Sequelize: { type: 'Buffer', data: [...] }
            let src = '';
            if (typeof conn.qrcode === 'string') {
                 src = conn.qrcode.startsWith('data:') ? conn.qrcode : `data:image/png;base64,${conn.qrcode}`;
            } else if (conn.qrcode && conn.qrcode.type === 'Buffer') {
                 // Convert buffer to base64
                 const binary = String.fromCharCode.apply(null, conn.qrcode.data);
                 const base64 = btoa(binary);
                 src = `data:image/png;base64,${base64}`;
            } else {
                 // Try to handle as raw base64 if it's just bytes
                 // Or maybe it is already a URL
                 src = conn.qrcode;
            }

            Modal.show({
                title: 'QR Code da Conexão',
                content: `
                    <div style="display: flex; justify-content: center; padding: 1rem;">
                        <img src="${src}" alt="QR Code" style="max-width: 100%; height: auto; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                    </div>
                `,
                confirmText: 'Fechar',
                type: 'primary',
                onConfirm: () => {} // Just close
            });
        };

        window.downloadConfig = async (id) => {
            const connections = await fetchConnections();
            const conn = connections.find(c => c.id === id);
            if (!conn || !conn.config) {
                alert('Configuração não disponível.');
                return;
            }

            const element = document.createElement('a');
            const file = new Blob([conn.config], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = `config-${conn.name.replace(/\s+/g, '-').toLowerCase()}.conf`; // Assuming OpenVPN or similar
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        };

        window.copyConfig = async (id) => {
            const connections = await fetchConnections();
            const conn = connections.find(c => c.id === id);
            if (!conn || !conn.config) {
                alert('Configuração não disponível.');
                return;
            }

            try {
                await navigator.clipboard.writeText(conn.config);
                // Show a small toast or alert
                const originalText = document.activeElement.innerHTML;
                const btn = document.activeElement;
                
                // Visual feedback on the button
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i>';
                }, 2000);
                
            } catch (err) {
                alert('Erro ao copiar: ' + err);
            }
        };

        // Table Logic
        async function refreshTable() {
            const tbody = document.getElementById('connections-table-body');
            if (!tbody) return;

            try {
                const connections = await fetchConnections();
                
                if (connections.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--text-light); padding: 2rem;">Nenhuma conexão encontrada.</td></tr>`;
                    return;
                }

                tbody.innerHTML = connections.map(conn => `
                    <tr>
                        <td>
                            <div style="font-weight: 500;">${conn.name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-light);">${conn.email}</div>
                        </td>
                        <td>${conn.Plan ? conn.Plan.name : '-'}</td>
                        <td>${conn.phone}</td>
                        <td>
                            <span class="badge badge-success">${conn.data_limit} MB</span>
                        </td>
                         <td>
                            <span style="font-weight: 500;">${conn.total_connections}</span>
                        </td>
                        <td>
                            <span class="badge ${conn.status === 'active' ? 'badge-success' : (conn.status === 'payment_pending' ? 'badge-warning' : 'badge-danger')}">
                                ${conn.status === 'active' ? 'Ativo' : (conn.status === 'payment_pending' ? 'Pendente' : 'Inativo')}
                            </span>
                        </td>
                        <td class="status-file-cell" data-id="${conn.id}">
                            ${getStatusFileContent(conn)}
                        </td>
                        <td>
                            <i class="fa-solid ${conn.internet ? 'fa-globe' : 'fa-ban'}" 
                               style="color: ${conn.internet ? 'var(--secondary-color)' : 'var(--danger-color)'}; margin-left: 0.5rem;"
                               title="${conn.internet ? 'Internet Ativa' : 'Internet Bloqueada'}"></i>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn btn-sm btn-secondary" onclick="toggleInternet(${conn.id})" title="${conn.internet ? 'Bloquear Internet' : 'Desbloquear Internet'}">
                                <i class="fa-solid ${conn.internet ? 'fa-lock' : 'fa-lock-open'}"></i>
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="openModal(${conn.id})" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteConnection(${conn.id})" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--danger-color); padding: 2rem;">Erro ao carregar dados.</td></tr>`;
            }
        }

        // Polling function for Status File
        async function updateStatusFiles() {
            try {
                // Fetch latest data without full table refresh
                const connections = await fetchConnections();
                
                connections.forEach(conn => {
                    const cell = document.querySelector(`.status-file-cell[data-id="${conn.id}"]`);
                    if (cell) {
                        const newContent = getStatusFileContent(conn);
                        // Only update DOM if content changed (avoids unnecessary repaints/flicker)
                        if (cell.innerHTML.replace(/\s/g, '') !== newContent.replace(/\s/g, '')) {
                             cell.innerHTML = newContent;
                        }
                    }
                });
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        // UI Helpers for Search Select
        window.toggleSelect = () => {
            const options = document.getElementById('select-options');
            if (!options) return;
            
            const isShowing = options.classList.contains('show');
            if (isShowing) {
                options.classList.remove('show');
            } else {
                options.classList.add('show');
                const input = options.querySelector('.search-select-input');
                if (input) setTimeout(() => input.focus(), 50);
                
                const closeHandler = (e) => {
                    if (!e.target.closest('.search-select-container')) {
                        options.classList.remove('show');
                        document.removeEventListener('click', closeHandler);
                    }
                };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }
        };

        window.renderClientOptions = (filter = '', selectedId = null) => {
            const clients = cachedClients || [];
            const filtered = clients.filter(c => 
                c.name.toLowerCase().includes(filter.toLowerCase()) || 
                (c.cpf && c.cpf.includes(filter)) ||
                c.email.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) return '<div class="search-select-option" style="cursor: default; color: var(--text-light);">Nenhum cliente encontrado</div>';
            
            const currentId = selectedId || document.getElementById('client-id-input')?.value;

            return filtered.map(c => {
                const safeName = c.name.replace(/'/g, "\\'");
                return `
                <div class="search-select-option ${c.id == currentId ? 'selected' : ''}" 
                     onclick="selectClient(${c.id}, '${safeName}')">
                    <span class="option-main">${c.name}</span>
                    <span class="option-sub">${c.cpf || 'Sem CPF'} • ${c.email}</span>
                </div>
            `}).join('');
        };

        window.filterOptions = (value) => {
            const list = document.getElementById('options-list');
            if (list) list.innerHTML = window.renderClientOptions(value);
        };

        window.selectClient = (id, name) => {
            const input = document.getElementById('client-id-input');
            const label = document.getElementById('selected-label');
            const options = document.getElementById('select-options');
            
            if (input) input.value = id;
            if (label) label.textContent = name;
            if (options) options.classList.remove('show');
        };

        // UI Helpers for Plan Select
        window.togglePlanSelect = () => {
            const options = document.getElementById('plan-select-options');
            if (!options) return;
            
            const isShowing = options.classList.contains('show');
            if (isShowing) {
                options.classList.remove('show');
            } else {
                options.classList.add('show');
                const input = options.querySelector('.search-select-input');
                if (input) setTimeout(() => input.focus(), 50);
                
                const closeHandler = (e) => {
                    if (!e.target.closest('#plan-select')) {
                        options.classList.remove('show');
                        document.removeEventListener('click', closeHandler);
                    }
                };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }
        };

        window.renderPlanOptions = (filter = '', selectedId = null) => {
            const plans = cachedPlans || [];
            const filtered = plans.filter(p => 
                p.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) return '<div class="search-select-option" style="cursor: default; color: var(--text-light);">Nenhum plano encontrado</div>';
            
            const currentId = selectedId || document.getElementById('plan-id-input')?.value;

            return filtered.map(p => {
                const safeName = p.name.replace(/'/g, "\\'");
                return `
                <div class="search-select-option ${p.id == currentId ? 'selected' : ''}" 
                     onclick="selectPlan(${p.id}, '${safeName}')">
                    <span class="option-main">${p.name}</span>
                    <span class="option-sub">${p.dataLimit} MB • R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</span>
                </div>
            `}).join('');
        };

        window.filterPlanOptions = (value) => {
            const list = document.getElementById('plan-options-list');
            if (list) list.innerHTML = window.renderPlanOptions(value);
        };

        window.selectPlan = (id, name) => {
            const input = document.getElementById('plan-id-input');
            const label = document.getElementById('plan-selected-label');
            const options = document.getElementById('plan-select-options');
            
            if (input) input.value = id;
            if (label) label.textContent = name;
            if (options) options.classList.remove('show');
        };

        // Actions
        window.openModal = async (id = null) => {
            let conn = { 
                clientId: null,
                planId: null,
                name: '', 
                cpf: '', 
                phone: '', 
                email: '', 
                total_connections: 1, 
                data_limit: 5, // Default 5MB
                status: 'active', 
                internet: true 
            };
            
            // Ensure clients are loaded
            let clients = cachedClients;
            if (!clients || clients.length === 0) {
                 try {
                    clients = await Clients.getAll();
                    cachedClients = clients;
                 } catch(err) {
                    console.error('Erro ao buscar clientes no fallback', err);
                 }
            }

            // Ensure plans are loaded
            let plans = cachedPlans;
            if (!plans || plans.length === 0) {
                 try {
                    plans = await Plans.getAll();
                    cachedPlans = plans;
                 } catch(err) {
                    console.error('Erro ao buscar planos no fallback', err);
                 }
            }

            if (id) {
                // Try cache first
                const found = cachedConnections.find(c => c.id === id);
                if (found) {
                     conn = found;
                     conn.clientId = found.ClientId; 
                     conn.planId = found.PlanId;
                } else {
                     // Fallback fetch
                     const connections = await fetchConnections();
                     const foundRefetched = connections.find(c => c.id === id);
                     if (foundRefetched) {
                        conn = foundRefetched;
                        conn.clientId = foundRefetched.ClientId;
                        conn.planId = foundRefetched.PlanId;
                     }
                }
                
                // Try to match by CPF if ClientId is missing (legacy data)
                if (!conn.clientId && conn.cpf && clients) {
                     const match = clients.find(c => c.cpf === conn.cpf);
                     if (match) conn.clientId = match.id;
                }
            }
            
            const isEdit = !!id;
            const selectedClient = clients.find(c => c.id == conn.clientId);
            const initialLabel = selectedClient ? selectedClient.name : 'Selecione um cliente...';

            const selectedPlan = plans.find(p => p.id == conn.planId);
            const initialPlanLabel = selectedPlan ? selectedPlan.name : 'Selecione um plano...';

            const formHTML = `
                <form id="connection-form">
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="hidden" name="clientId" id="client-id-input" value="${conn.clientId || ''}" required>
                        
                        <div class="search-select-container" id="client-select">
                            <div class="search-select-trigger" onclick="toggleSelect()">
                                <span id="selected-label">${initialLabel}</span>
                                <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
                            </div>
                            <div class="search-select-options" id="select-options">
                                <input type="text" class="search-select-input" placeholder="Buscar por nome, CPF ou email..." onclick="event.stopPropagation()" oninput="filterOptions(this.value)">
                                <div id="options-list">
                                    ${window.renderClientOptions('', conn.clientId)}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Plano</label>
                        <input type="hidden" name="planId" id="plan-id-input" value="${conn.planId || ''}" required>
                        
                        <div class="search-select-container" id="plan-select">
                            <div class="search-select-trigger" onclick="togglePlanSelect()">
                                <span id="plan-selected-label">${initialPlanLabel}</span>
                                <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
                            </div>
                            <div class="search-select-options" id="plan-select-options">
                                <input type="text" class="search-select-input" placeholder="Buscar por nome..." onclick="event.stopPropagation()" oninput="filterPlanOptions(this.value)">
                                <div id="plan-options-list">
                                    ${window.renderPlanOptions('', conn.planId)}
                                </div>
                            </div>
                        </div>
                        <small style="color: var(--text-light);">O pacote de dados será definido pelo plano selecionado.</small>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                         <div class="form-group">
                            <label>Status</label>
                            <select name="status" class="form-control">
                                <option value="active" ${conn.status === 'active' ? 'selected' : ''}>Ativo</option>
                                <option value="inactive" ${conn.status !== 'active' ? 'selected' : ''}>Inativo</option>
                            </select>
                        </div>
                    </div>
                </form>
            `;

            Modal.show({
                title: isEdit ? 'Editar Conexão' : 'Nova Conexão',
                content: formHTML,
                confirmText: 'Salvar',
                onConfirm: async () => {
                    const form = document.getElementById('connection-form');
                    const clientId = form.querySelector('[name="clientId"]').value;
                    const planId = form.querySelector('[name="planId"]').value;
                    
                    if (!clientId) {
                        alert('Por favor, selecione um cliente.');
                        throw new Error('Cliente obrigatório');
                    }

                    if (!planId) {
                         alert('Por favor, selecione um plano.');
                         throw new Error('Plano obrigatório');
                    }

                    const payload = {
                        clientId: clientId,
                        planId: planId,
                        status: form.querySelector('[name="status"]').value
                    };

                    try {
                        if (isEdit) {
                            await Connections.update(id, payload);
                        } else {
                            await Connections.create(payload);
                        }
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao salvar: ' + error.message);
                        throw error;
                    }
                }
            });
        };

        window.deleteConnection = (id) => {
            Modal.show({
                title: 'Excluir Conexão',
                content: '<p>Tem certeza que deseja excluir esta conexão? Esta ação não pode ser desfeita.</p>',
                confirmText: 'Excluir',
                type: 'danger',
                onConfirm: async () => {
                    try {
                        await Connections.delete(id);
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao excluir: ' + error.message);
                    }
                }
            });
        };

        window.toggleInternet = (id) => {
             // We need to fetch current state or pass it. 
             // Ideally UI should reflect state optimistically or re-fetch.
             // For now, let's just call toggle.
             
            Modal.show({
                title: 'Alterar Acesso à Internet',
                content: `<p>Deseja alterar o status de internet desta conexão?</p>`,
                confirmText: 'Confirmar',
                type: 'primary',
                onConfirm: async () => {
                    try {
                        await Connections.toggleInternet(id);
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao alterar internet: ' + error.message);
                    }
                }
            });
        };
    </script>
</body>
</html>
