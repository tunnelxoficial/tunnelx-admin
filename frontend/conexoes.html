<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexões - TunnelX Admin</title>

    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
    <style>
        .status-file-loader {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Custom Search Select */
        .search-select-container {
            position: relative;
            width: 100%;
        }
        .search-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }
        .search-select-trigger:hover {
            border-color: var(--primary-color);
        }
        .search-select-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            margin-top: 0.25rem;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }
        .search-select-options.show {
            display: block;
        }
        .search-select-input {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-bottom: 1px solid var(--border-color);
            outline: none;
            font-family: inherit;
        }
        .search-select-option {
            padding: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .search-select-option:hover {
            background-color: #f8fafc;
        }
        .search-select-option.selected {
            background-color: #eff6ff;
            color: var(--primary-color);
        }
        .option-main {
            font-weight: 500;
        }
        .option-sub {
            font-size: 0.75rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Data Management
        let cachedClients = [];
        let cachedConnections = [];
        let cachedPlans = [];

        async function fetchConnections() {
            try {
                const conns = await Connections.getAll();
                cachedConnections = conns;
                return conns;
            } catch (error) {
                console.error('Failed to fetch connections', error);
                return [];
            }
        }

        async function preloadClients() {
            try {
                cachedClients = await Clients.getAll();
            } catch (err) {
                console.error('Erro ao pré-carregar clientes', err);
            }
        }

        async function preloadPlans() {
            try {
                cachedPlans = await Plans.getAll();
            } catch (err) {
                console.error('Erro ao pré-carregar planos', err);
            }
        }

        // Render Page
        document.addEventListener('DOMContentLoaded', () => {
            preloadClients();
            preloadPlans();

            setTimeout(() => {
                const content = document.getElementById('page-content');
                if (!content) return;

                content.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <div class="search-box" style="display: flex; gap: 0.5rem;">
                            <!-- Search could be added here -->
                        </div>
                        <button class="btn btn-primary" id="btn-add">
                            <i class="fa-solid fa-plus"></i> Nova Conexão
                        </button>
                    </div>

                    <div class="table-container">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Plano</th>
                                        <th>Pacote</th>
                                        <th>Conexões</th>
                                        <th>Status</th>
                                        <th>Pagamento</th>
                                        <th>Status File</th>
                                        <th>Internet</th>
                                        <th style="text-align: right;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="connections-table-body">
                                    <tr><td colspan="9" style="text-align: center; padding: 2rem;">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                refreshTable();
                
                // Start polling for status file updates
                // Antes so a celula de Status File era reescrita: mudancas de status e
                // payment_status vindas do webhook ficavam invisiveis com a pagina aberta.
                setInterval(refreshTable, 30000);

                document.getElementById('btn-add').addEventListener('click', () => openModal());

            }, 100);
        });

        // Badge do estado de pagamento (payment_status e gravado pelo webhook Asaas)
        function paymentBadge(v) {
            const map = {
                PAID:     ['badge-success', 'Pago'],
                WAIT:     ['badge-warning', 'Aguardando'],
                OVERDUE:  ['badge-danger',  'Vencido'],
                REFUNDED: ['badge-info',    'Estornado']
            };
            const m = map[v];
            return m ? `<span class="badge ${m[0]}">${m[1]}</span>`
                     : '<span class="badge badge-info">Sem cobrança</span>';
        }

        // Helper to render Status File column
        function getStatusFileContent(conn) {
            const acoes = `
                <button class="btn btn-sm btn-outline-primary" onclick="showQRCode(${conn.id})" title="Ver QR Code">
                    <i class="fa-solid fa-qrcode"></i>
                </button>
                <button class="btn btn-sm btn-outline-success" onclick="downloadConfig(${conn.id})" title="Baixar .conf (WireGuard)">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" onclick="copyConfig(${conn.id}, this)" title="Copiar configuração">
                    <i class="fa-regular fa-copy"></i>
                </button>
                <button class="btn btn-sm btn-secondary" onclick="reprovisionConnection(${conn.id})" title="Regerar config e QR com o endpoint atual">
                    <i class="fa-solid fa-rotate"></i>
                </button>`;

            if (conn.status_queue === 'WAIT') {
                // O worker roda a cada 60s. Passando de 5 min, quase sempre significa
                // que o TunnelX Manager esta fechado ou sem acesso ao banco.
                const min = conn.updatedAt
                    ? Math.floor((Date.now() - new Date(conn.updatedAt).getTime()) / 60000)
                    : 0;
                if (min >= 5) {
                    return `
                        <div class="status-file-loader">
                            <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger-color);"></i>
                            <span>Na fila há ${min} min — verifique o TunnelX Manager</span>
                        </div>`;
                }
                return `
                    <div class="status-file-loader">
                        <div class="spinner"></div>
                        <span>Aguardando fila...</span>
                    </div>`;
            }

            if (conn.status_queue === 'CREATED') {
                return `<div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span class="badge badge-success">Provisionado</span>${acoes}
                </div>`;
            }

            return `<div style="display: flex; gap: 0.5rem; align-items: center;">
                <span class="badge badge-danger">Não provisionado</span>
                <button class="btn btn-sm btn-secondary" onclick="reprovisionConnection(${conn.id})" title="Enviar para a fila">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>`;
        }

        window.reprovisionConnection = (id) => {
            Modal.show({
                title: 'Regerar configuração',
                content: '<p>A configuração e o QR atuais serão substituídos por novos, gerados com o endpoint atual do servidor. O cliente precisará importar o novo arquivo. Continuar?</p>',
                confirmText: 'Regerar',
                type: 'danger',
                onConfirm: async () => {
                    try {
                        await Connections.reprovision(id);
                        refreshTable();
                    } catch (e) {
                        alert('Erro ao reenfileirar: ' + e.message);
                    }
                }
            });
        };

        // Action Functions for Status File
        // Busca config e QR de UMA conexao. O endpoint devolve o QR ja em base64,
        // eliminando a conversao de Buffer no browser.
        async function loadConnectionFiles(id) {
            try {
                return await Connections.getFiles(id);
            } catch (e) {
                alert('Erro ao obter os dados da conexão: ' + e.message);
                return null;
            }
        }

        window.showQRCode = async (id) => {
            const data = await loadConnectionFiles(id);
            if (!data || !data.qrcode_base64) {
                alert('QR Code ainda não disponível. A conexão pode não ter sido provisionada.');
                return;
            }

            Modal.show({
                title: 'QR Code da Conexão (WireGuard)',
                content: `
                    <div style="display: flex; justify-content: center; padding: 1rem;">
                        <img src="data:image/png;base64,${data.qrcode_base64}" alt="QR Code"
                             style="max-width: 100%; height: auto; border: 1px solid var(--border-color); border-radius: 0.5rem;">
                    </div>
                `,
                confirmText: 'Fechar',
                type: 'primary',
                onConfirm: () => {}
            });
        };

        window.downloadConfig = async (id) => {
            const data = await loadConnectionFiles(id);
            if (!data || !data.config) {
                alert('Configuração ainda não disponível. A conexão pode não ter sido provisionada.');
                return;
            }

            // Remove acentos e caracteres de caminho do nome do arquivo
            const safe = (data.name || 'cliente')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cliente';

            const url = URL.createObjectURL(new Blob([data.config], { type: 'text/plain;charset=utf-8' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = `tunnelx-${safe}.conf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        window.copyConfig = async (id, btn) => {
            const data = await loadConnectionFiles(id);
            if (!data || !data.config) {
                alert('Configuração ainda não disponível. A conexão pode não ter sido provisionada.');
                return;
            }

            const original = btn ? btn.innerHTML : null;
            let ok = false;

            // navigator.clipboard so existe em contexto seguro (https ou localhost)
            if (navigator.clipboard && window.isSecureContext) {
                try { await navigator.clipboard.writeText(data.config); ok = true; } catch (e) { ok = false; }
            }

            if (!ok) {
                const ta = document.createElement('textarea');
                ta.value = data.config;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus(); ta.select();
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
            }

            // Ultimo recurso: mostra o texto para o operador copiar na mao
            if (!ok) {
                Modal.show({
                    title: 'Copiar configuração',
                    content: `<textarea readonly style="width:100%;height:260px;font-family:monospace;font-size:.75rem;">${data.config.replace(/</g, '&lt;')}</textarea>`,
                    confirmText: 'Fechar',
                    type: 'primary',
                    onConfirm: () => {}
                });
                return;
            }

            if (btn && original !== null) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => { btn.innerHTML = original; }, 2000);
            }
        };

        // Table Logic
        async function refreshTable() {
            const tbody = document.getElementById('connections-table-body');
            if (!tbody) return;

            try {
                const connections = await fetchConnections();
                
                if (connections.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--text-light); padding: 2rem;">Nenhuma conexão encontrada.</td></tr>`;
                    return;
                }

                tbody.innerHTML = connections.map(conn => `
                    <tr>
                        <td>
                            <div style="font-weight: 500;">${conn.name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-light);">${conn.email}</div>
                        </td>
                        <td>${conn.Plan ? conn.Plan.name : '-'}</td>
                        <td>
                            <span class="badge badge-success">${conn.data_limit} MB</span>
                        </td>
                         <td>
                            <span style="font-weight: 500;">${conn.total_connections}</span>
                        </td>
                        <td>
                            <span class="badge ${conn.status === 'active' ? 'badge-success' : (conn.status === 'payment_pending' ? 'badge-warning' : 'badge-danger')}">
                                ${conn.status === 'active' ? 'Ativo' : (conn.status === 'payment_pending' ? 'Pendente de pagamento' : 'Inativo')}
                            </span>
                        </td>
                        <td>${paymentBadge(conn.payment_status)}</td>
                        <td class="status-file-cell" data-id="${conn.id}">
                            ${getStatusFileContent(conn)}
                        </td>
                        <td>
                            <i class="fa-solid ${conn.internet ? 'fa-globe' : 'fa-ban'}" 
                               style="color: ${conn.internet ? 'var(--secondary-color)' : 'var(--danger-color)'}; margin-left: 0.5rem;"
                               title="${conn.internet ? 'Internet Ativa' : 'Internet Bloqueada'}"></i>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn btn-sm btn-secondary" onclick="toggleInternet(${conn.id})" title="${conn.internet ? 'Bloquear Internet' : 'Desbloquear Internet'}">
                                <i class="fa-solid ${conn.internet ? 'fa-lock' : 'fa-lock-open'}"></i>
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="openModal(${conn.id})" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteConnection(${conn.id})" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--danger-color); padding: 2rem;">Erro ao carregar dados.</td></tr>`;
            }
        }

        // Polling function for Status File
        async function updateStatusFiles() {
            try {
                // Fetch latest data without full table refresh
                const connections = await fetchConnections();
                
                connections.forEach(conn => {
                    const cell = document.querySelector(`.status-file-cell[data-id="${conn.id}"]`);
                    if (cell) {
                        const newContent = getStatusFileContent(conn);
                        // Only update DOM if content changed (avoids unnecessary repaints/flicker)
                        if (cell.innerHTML.replace(/\s/g, '') !== newContent.replace(/\s/g, '')) {
                             cell.innerHTML = newContent;
                        }
                    }
                });
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        /* ------------------------------------------------------------------
           Painel de opcoes fora do modal.

           O dropdown era `position: absolute` dentro do formulario, entao o
           `overflow` do modal cortava a lista - e cortaria ainda mais agora que
           o corpo do modal rola.

           Trocar para `position: fixed` NAO resolve: `.modal-content` tem
           `transform`, e um ancestral transformado passa a ser o bloco que
           contem os elementos fixos. Eles continuariam presos ali dentro.

           Por isso o painel e MOVIDO para o <body> enquanto esta aberto, com
           coordenadas calculadas a partir do gatilho, e devolvido ao lugar ao
           fechar. Voltar e obrigatorio: se o modal for fechado com o painel
           ainda no body, ele fica orfao na pagina.
           ------------------------------------------------------------------ */
        const selectAberto = { painel: null, origem: null, gatilho: null, quadro: null, aoClicar: null, ultimo: null };

        function posicionarPainel() {
            const { painel, gatilho } = selectAberto;
            if (!painel || !gatilho) return;

            const r = gatilho.getBoundingClientRect();
            const folga = 8;
            const abaixo = window.innerHeight - r.bottom - folga;
            const acima = r.top - folga;
            // Abre para cima quando embaixo nao cabe - o caso do select de plano,
            // que fica na metade de baixo do formulario.
            const paraCima = abaixo < 200 && acima > abaixo;
            const altura = Math.min(280, Math.max(160, paraCima ? acima : abaixo));

            painel.style.position = 'fixed';
            painel.style.left = r.left + 'px';
            // O CSS do painel traz right: 0 para o modo ancorado. Com left e
            // width definidos ele seria ignorado, mas zerar deixa explicito.
            painel.style.right = 'auto';
            painel.style.width = r.width + 'px';
            painel.style.maxHeight = altura + 'px';
            painel.style.margin = '0';
            // Acima do overlay do modal, que esta em 1000.
            painel.style.zIndex = '1100';

            if (paraCima) {
                painel.style.top = 'auto';
                painel.style.bottom = (window.innerHeight - r.top + 4) + 'px';
            } else {
                painel.style.bottom = 'auto';
                painel.style.top = (r.bottom + 4) + 'px';
            }
        }

        window.fecharSelect = () => {
            const s = selectAberto;
            if (!s.painel) return;

            s.painel.classList.remove('show');
            s.painel.removeAttribute('style');
            s.origem.appendChild(s.painel);

            if (s.quadro) cancelAnimationFrame(s.quadro);
            s.quadro = null;
            s.ultimo = null;
            document.removeEventListener('click', s.aoClicar, true);

            s.painel = null; s.origem = null; s.gatilho = null;
        };

        function abrirSelect(idPainel, idContainer) {
            const painel = document.getElementById(idPainel);
            const container = document.getElementById(idContainer);
            if (!painel || !container) return;

            // Segundo clique no mesmo gatilho fecha.
            const jaAberto = selectAberto.painel === painel;
            window.fecharSelect();
            if (jaAberto) return;

            selectAberto.painel = painel;
            selectAberto.origem = painel.parentElement;
            selectAberto.gatilho = container.querySelector('.search-select-trigger');

            document.body.appendChild(painel);
            painel.classList.add('show');
            posicionarPainel();

            /* Acompanha o gatilho por quadro, e nao por evento de scroll.
               O corpo do modal rola por conta propria; um listener de 'scroll'
               na window depende de o evento chegar ate la, e isso varia com o
               navegador. Comparar o retangulo funciona sempre - e cobre tambem
               redimensionamento e mudanca de layout, sem listener nenhum.
               So roda enquanto o painel esta aberto. */
            const acompanhar = () => {
                if (!selectAberto.painel) return;
                const r = selectAberto.gatilho.getBoundingClientRect();
                const chave = r.top + ':' + r.left + ':' + r.width;
                if (chave !== selectAberto.ultimo) {
                    selectAberto.ultimo = chave;
                    posicionarPainel();
                }
                selectAberto.quadro = requestAnimationFrame(acompanhar);
            };
            selectAberto.quadro = requestAnimationFrame(acompanhar);

            // Fase de captura: o painel volta para dentro do modal ANTES de
            // qualquer outro handler rodar. E o que impede que fechar o modal
            // pelo X deixe o painel solto no body.
            selectAberto.aoClicar = (e) => {
                if (e.target.closest('#' + idPainel)) return;
                if (e.target.closest('#' + idContainer)) return;
                window.fecharSelect();
            };
            setTimeout(() => document.addEventListener('click', selectAberto.aoClicar, true), 0);

            const busca = painel.querySelector('.search-select-input');
            if (busca) setTimeout(() => busca.focus(), 50);
        }

        // UI Helpers for Search Select
        window.toggleSelect = () => abrirSelect('select-options', 'client-select');

        window.renderClientOptions = (filter = '', selectedId = null) => {
            const clients = cachedClients || [];
            const filtered = clients.filter(c => 
                c.name.toLowerCase().includes(filter.toLowerCase()) || 
                (c.cpf && c.cpf.includes(filter)) ||
                c.email.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) return '<div class="search-select-option" style="cursor: default; color: var(--text-light);">Nenhum cliente encontrado</div>';
            
            const currentId = selectedId || document.getElementById('client-id-input')?.value;

            return filtered.map(c => {
                const safeName = c.name.replace(/'/g, "\\'");
                return `
                <div class="search-select-option ${c.id == currentId ? 'selected' : ''}" 
                     onclick="selectClient(${c.id}, '${safeName}')">
                    <span class="option-main">${c.name}</span>
                    <span class="option-sub">${c.cpf || 'Sem CPF'} • ${c.email}</span>
                </div>
            `}).join('');
        };

        window.filterOptions = (value) => {
            const list = document.getElementById('options-list');
            if (list) list.innerHTML = window.renderClientOptions(value);
        };

        window.selectClient = (id, name) => {
            const input = document.getElementById('client-id-input');
            const label = document.getElementById('selected-label');
            const options = document.getElementById('select-options');
            
            if (input) input.value = id;
            if (label) label.textContent = name;
            // fecharSelect e nao classList.remove: o painel esta no <body> agora
            // e precisa voltar para dentro do formulario.
            if (options) window.fecharSelect();
        };

        // UI Helpers for Plan Select
        window.togglePlanSelect = () => abrirSelect('plan-select-options', 'plan-select');

        window.renderPlanOptions = (filter = '', selectedId = null) => {
            const plans = cachedPlans || [];
            const filtered = plans.filter(p => 
                p.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) return '<div class="search-select-option" style="cursor: default; color: var(--text-light);">Nenhum plano encontrado</div>';
            
            const currentId = selectedId || document.getElementById('plan-id-input')?.value;

            return filtered.map(p => {
                const safeName = p.name.replace(/'/g, "\\'");
                return `
                <div class="search-select-option ${p.id == currentId ? 'selected' : ''}" 
                     onclick="selectPlan(${p.id}, '${safeName}')">
                    <span class="option-main">${p.name}</span>
                    <span class="option-sub">${p.dataLimit} MB • R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</span>
                </div>
            `}).join('');
        };

        window.filterPlanOptions = (value) => {
            const list = document.getElementById('plan-options-list');
            if (list) list.innerHTML = window.renderPlanOptions(value);
        };

        window.selectPlan = (id, name) => {
            const input = document.getElementById('plan-id-input');
            const label = document.getElementById('plan-selected-label');
            const options = document.getElementById('plan-select-options');
            
            if (input) input.value = id;
            if (label) label.textContent = name;
            if (options) window.fecharSelect();
        };

        // Actions
        window.openModal = async (id = null) => {
            let conn = { 
                clientId: null,
                planId: null,
                name: '', 
                cpf: '', 
                phone: '', 
                email: '', 
                total_connections: 1, 
                data_limit: 5, // Default 5MB
                status: 'active', 
                internet: true 
            };
            
            // Ensure clients are loaded
            let clients = cachedClients;
            if (!clients || clients.length === 0) {
                 try {
                    clients = await Clients.getAll();
                    cachedClients = clients;
                 } catch(err) {
                    console.error('Erro ao buscar clientes no fallback', err);
                 }
            }

            // Ensure plans are loaded
            let plans = cachedPlans;
            if (!plans || plans.length === 0) {
                 try {
                    plans = await Plans.getAll();
                    cachedPlans = plans;
                 } catch(err) {
                    console.error('Erro ao buscar planos no fallback', err);
                 }
            }

            if (id) {
                // Try cache first
                const found = cachedConnections.find(c => c.id === id);
                if (found) {
                     conn = found;
                     conn.clientId = found.ClientId; 
                     conn.planId = found.PlanId;
                } else {
                     // Fallback fetch
                     const connections = await fetchConnections();
                     const foundRefetched = connections.find(c => c.id === id);
                     if (foundRefetched) {
                        conn = foundRefetched;
                        conn.clientId = foundRefetched.ClientId;
                        conn.planId = foundRefetched.PlanId;
                     }
                }
                
                // Try to match by CPF if ClientId is missing (legacy data)
                if (!conn.clientId && conn.cpf && clients) {
                     const match = clients.find(c => c.cpf === conn.cpf);
                     if (match) conn.clientId = match.id;
                }
            }
            
            const isEdit = !!id;
            const selectedClient = clients.find(c => c.id == conn.clientId);
            const initialLabel = selectedClient ? selectedClient.name : 'Selecione um cliente...';

            const selectedPlan = plans.find(p => p.id == conn.planId);
            const initialPlanLabel = selectedPlan ? selectedPlan.name : 'Selecione um plano...';

            const formHTML = `
                <form id="connection-form">
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="hidden" name="clientId" id="client-id-input" value="${conn.clientId || ''}" required>
                        
                        <div class="search-select-container" id="client-select">
                            <div class="search-select-trigger" onclick="toggleSelect()">
                                <span id="selected-label">${initialLabel}</span>
                                <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
                            </div>
                            <div class="search-select-options" id="select-options">
                                <input type="text" class="search-select-input" placeholder="Buscar por nome, CPF ou email..." onclick="event.stopPropagation()" oninput="filterOptions(this.value)">
                                <div id="options-list">
                                    ${window.renderClientOptions('', conn.clientId)}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Plano</label>
                        <input type="hidden" name="planId" id="plan-id-input" value="${conn.planId || ''}" required>
                        
                        <div class="search-select-container" id="plan-select">
                            <div class="search-select-trigger" onclick="togglePlanSelect()">
                                <span id="plan-selected-label">${initialPlanLabel}</span>
                                <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem;"></i>
                            </div>
                            <div class="search-select-options" id="plan-select-options">
                                <input type="text" class="search-select-input" placeholder="Buscar por nome..." onclick="event.stopPropagation()" oninput="filterPlanOptions(this.value)">
                                <div id="plan-options-list">
                                    ${window.renderPlanOptions('', conn.planId)}
                                </div>
                            </div>
                        </div>
                        <small style="color: var(--text-light);">O pacote de dados será definido pelo plano selecionado.</small>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                         <div class="form-group">
                            <label>Status</label>
                            <select name="status" class="form-control">
                                <option value="active" ${conn.status === 'active' ? 'selected' : ''}>Ativo</option>
                                <option value="payment_pending" ${conn.status === 'payment_pending' ? 'selected' : ''}>Pendente de pagamento</option>
                                <option value="inactive" ${conn.status === 'inactive' ? 'selected' : ''}>Inativo</option>
                            </select>
                        </div>
                    </div>
                </form>
            `;

            Modal.show({
                title: isEdit ? 'Editar Conexão' : 'Nova Conexão',
                content: formHTML,
                confirmText: 'Salvar',
                onConfirm: async () => {
                    const form = document.getElementById('connection-form');
                    const clientId = form.querySelector('[name="clientId"]').value;
                    const planId = form.querySelector('[name="planId"]').value;
                    
                    if (!clientId) {
                        alert('Por favor, selecione um cliente.');
                        throw new Error('Cliente obrigatório');
                    }

                    if (!planId) {
                         alert('Por favor, selecione um plano.');
                         throw new Error('Plano obrigatório');
                    }

                    const payload = {
                        clientId: clientId,
                        planId: planId,
                        status: form.querySelector('[name="status"]').value
                    };

                    try {
                        if (isEdit) {
                            await Connections.update(id, payload);
                        } else {
                            await Connections.create(payload);
                        }
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao salvar: ' + error.message);
                        throw error;
                    }
                }
            });
        };

        window.deleteConnection = (id) => {
            Modal.show({
                title: 'Excluir Conexão',
                content: '<p>Tem certeza que deseja excluir esta conexão? Esta ação não pode ser desfeita.</p>',
                confirmText: 'Excluir',
                type: 'danger',
                onConfirm: async () => {
                    try {
                        await Connections.delete(id);
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao excluir: ' + error.message);
                    }
                }
            });
        };

        window.toggleInternet = (id) => {
             // We need to fetch current state or pass it. 
             // Ideally UI should reflect state optimistically or re-fetch.
             // For now, let's just call toggle.
             
            Modal.show({
                title: 'Alterar Acesso à Internet',
                content: `<p>Deseja alterar o status de internet desta conexão?</p>`,
                confirmText: 'Confirmar',
                type: 'primary',
                onConfirm: async () => {
                    try {
                        await Connections.toggleInternet(id);
                        refreshTable();
                    } catch (error) {
                        alert('Erro ao alterar internet: ' + error.message);
                    }
                }
            });
        };
    </script>
</body>
</html>
